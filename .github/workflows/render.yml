name: Render TikTok Shop videos

# Upload raw clips to projects/<name>/ (e.g. from the GitHub app/website),
# and this workflow renders out/<name>.mp4 and attaches it as a downloadable artifact.
on:
  push:
    paths:
      - "projects/**"
      - "assets/music/**"
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name (empty = all projects)"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Render
        run: npm run make -- ${{ github.event.inputs.project }}
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-videos
          path: |
            out/*.mp4
            projects/*/project.json
          if-no-files-found: warn
